name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Verify tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag/version mismatch" }
      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release
      - name: Package portable payload
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) { throw 'Signing secrets are required; release fails closed.' }
          $certificate = Join-Path $env:RUNNER_TEMP 'winputlan-signing.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          ./scripts/finalize.ps1 -Configuration Release -CertificatePath $certificate -CertificatePassword $env:SIGNING_PFX_PASSWORD
      - name: Release notes
        shell: pwsh
        run: ./scripts/release-notes.ps1 | Set-Content artifacts/release-notes.md -Encoding UTF8
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: artifacts/release-notes.md
          files: |
            artifacts/WinputLan-*/**
            artifacts/installer/WinputLan-*-setup.exe
          fail_on_unmatched_files: true
