name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Verify tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag/version mismatch" }
      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify report backend
        shell: pwsh
        working-directory: services/bug-reports
        run: |
          npm ci --no-fund --no-audit
          if ($LASTEXITCODE -ne 0) { throw 'Report dependencies failed.' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Report backend tests failed.' }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Package setup and sign OTA manifest
        shell: pwsh
        env:
          OTA_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.OTA_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OTA_SIGNING_PRIVATE_KEY_PEM)) { throw 'OTA_SIGNING_PRIVATE_KEY_PEM is required; release fails closed.' }
          $key = Join-Path $env:RUNNER_TEMP 'winputlan-ota-private.pem'
          [IO.File]::WriteAllText($key, $env:OTA_SIGNING_PRIVATE_KEY_PEM, [Text.UTF8Encoding]::new($false))
          ./scripts/finalize.ps1 -Configuration Release -OtaPrivateKeyPath $key
          Remove-Item -LiteralPath $key -Force
      # SwissTechKnife module package, attached to this same release: older releases are deleted below,
      # so a separately published module zip would disappear. The host catalog takes its sha256 and size.
      - name: Package SwissTechKnife module
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          ./scripts/pack-module.ps1 -Configuration Release | Out-Null
          $zip = "artifacts/winput-lan-$version.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "Module package $zip was not produced." }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $zip).Length
          @(
            '### SwissTechKnife module (winput-lan)'
            ''
            '| File | Version | sha256 | size |'
            '|---|---|---|---|'
            "| winput-lan-$version.zip | $version | ``$hash`` | $size |"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
      - name: Release notes
        shell: pwsh
        run: ./scripts/release-notes.ps1 | Set-Content artifacts/release-notes.md -Encoding UTF8
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: artifacts/release-notes.md
          files: |
            artifacts/WinputLan-*/**
            artifacts/winput-lan-*.zip
          fail_on_unmatched_files: true
      # Only the newest release is kept to save storage quota; the updater reads releases/latest. Git tags stay.
      - name: Delete older releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $current = '${{ github.ref_name }}'
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | Where-Object { $_ -and $_ -ne $current } | ForEach-Object {
            gh release delete $_ --yes
            if ($LASTEXITCODE -ne 0) { throw "Failed to delete release $_" }
          }
