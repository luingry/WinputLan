name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/bug-reports/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: services/bug-reports
      - run: npm test
        working-directory: services/bug-reports
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Restore
        run: dotnet restore WinputLan.sln
      - name: Release build
        run: dotnet build WinputLan.sln -c Release --no-restore
      - name: Core tests
        run: dotnet run --project tests/WinputLan.Tests/WinputLan.Tests.csproj -c Release --no-build
      - name: Loopback smoke
        run: tests/WinputLan.Loopback/bin/Release/net48/WinputLan.Loopback.exe
      - name: Release invariants
        shell: pwsh
        run: ./scripts/validate-release.ps1 -Configuration Release
